<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FreshO Home Products</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#008000;
    color:white;
    text-align:center;
    padding:40px 20px;
}

header h1{
    font-size:40px;
    margin-bottom:10px;
}

header p{
    font-size:20px;
}

.container{
    width:95%;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.product{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.product h2{
    margin-bottom:10px;
}

.product p{
    margin-bottom:10px;
}

.price{
    color:green;
    font-size:32px;
    font-weight:bold;
    margin-bottom:15px;
}

.button{
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    display:inline-block;
    font-weight:bold;
}

.button:hover{
    background:#1ea952;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}

    <div class="product">

        <a class="button"

           Order on WhatsApp
        </a>

    <div class="product">

        <a class="button"

</div>

<footer>

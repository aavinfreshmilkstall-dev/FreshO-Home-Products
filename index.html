<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshO Home Products</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#14263d;--mute:#64748b;--line:#dde4ee;--blue:#1a56a8;--green:#1e8449;--red:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2a;--card:#172538;--ink:#eaf0f8;--mute:#9db0c7;--line:#27384f;--blue:#6aa3ee;--green:#4cc47f;--red:#ff8a80}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
h1{font-size:1.15rem;margin:0}
.cartbtn{border:0;background:var(--blue);color:#fff;font-weight:600;padding:9px 14px;border-radius:8px;font-size:.95rem}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 14px}
.cats button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:20px;font-size:.9rem}
.cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:0 14px 90px;max-width:1000px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.p img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.p .b{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.p .n{font-weight:600;font-size:.95rem}
.p .s{color:var(--mute);font-size:.85rem}
.p .pr{font-weight:700;margin-top:auto}
.add{border:0;background:var(--green);color:#fff;padding:9px;border-radius:7px;font-weight:600;margin-top:6px}
.add[disabled]{background:var(--line);color:var(--mute)}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.qty button{width:36px;height:36px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;font-size:1.1rem}
.msg{padding:30px 0;color:var(--mute);text-align:center}
.msg.err{color:var(--red)}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
#panel.open{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:16px;max-width:600px;margin:0 auto}
.sheet h2{margin:0 0 10px;font-size:1.1rem;display:flex;justify-content:space-between}
.sheet h2 button{border:0;background:none;color:var(--ink);font-size:1.4rem}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;font-size:.92rem}
.row .t small{color:var(--mute);display:block}
.row .qty{margin:0;gap:8px}
.row .qty button{width:32px;height:32px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;padding:12px 0}
input,textarea{width:100%;padding:11px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.wa{width:100%;border:0;background:#1fa855;color:#fff;font-weight:700;font-size:1rem;padding:13px;border-radius:9px}
.hint{color:var(--red);font-size:.85rem;min-height:1.2em;margin:0 0 6px}
</style>
</head>
<body>

<header>
  <h1 id="shop"></h1>
  <button class="cartbtn" id="open">Cart (<span id="cnt">0</span>)</button>
</header>
<div class="cats" id="cats"></div>
<main><div id="list" class="grid"></div><div id="status" class="msg">Loading products…</div></main>

<div id="panel">
  <div class="sheet">
    <h2>Your cart <button id="close" aria-label="Close">×</button></h2>
    <div id="items"></div>
    <div class="total"><span>Total</span><span id="tot">₹0</span></div>
    <input id="cn" placeholder="Your name" autocomplete="name">
    <input id="cp" placeholder="Phone number" inputmode="tel" autocomplete="tel">
    <textarea id="ca" rows="2" placeholder="Delivery address"></textarea>
    <p class="hint" id="hint"></p>
    <button class="wa" id="send">Order on WhatsApp</button>
  </div>
</div>

<script>
/* ===== EDIT ONLY THESE 3 LINES ===== */
var SHOP_NAME = "FreshO Home Products";
var WHATSAPP  = "919894043765";   // country code + number, no + or spaces
var CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTTZAFsFciHj3ZiLtwSKTweWz9tgiqv4CFRAx46MOQxA9YWdHBn8X4Aj8fAiV1VN0GhCr-tte8yP0F/pub?gid=0&single=true&output=csv";
/* =================================== */

var $ = function(id){return document.getElementById(id)};
var products = [], cart = {}, cat = "All";
document.title = SHOP_NAME; $("shop").textContent = SHOP_NAME;

try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch(e){ cart = {}; }
function save(){ try { localStorage.setItem("cart", JSON.stringify(cart)); } catch(e){} }

function parseCSV(t){
  var rows=[],r=[],f="",q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==","){ r.push(f); f=""; }
    else if(c=="\n"||c=="\r"){ if(c=="\r"&&t[i+1]=="\n")i++; r.push(f); f=""; rows.push(r); r=[]; }
    else f+=c;
  }
  if(f!==""||r.length){ r.push(f); rows.push(r); }
  return rows;
}
function fileId(s){ var m=String(s||"").match(/[-\w]{25,}/); return m?m[0]:""; }
function imgUrl(p){
  var id = fileId(p.link) || fileId(p.file);
  return id ? "https://drive.google.com/thumbnail?id="+id+"&sz=w600" : "";
}

fetch(CSV_URL).then(function(r){return r.text()}).then(function(t){
  var rows = parseCSV(t), head = rows.shift().map(function(h){return h.trim().toLowerCase()});
  function col(){ for(var a=0;a<arguments.length;a++){ var i=head.findIndex(function(h){return h.indexOf(arguments[a])===0}.bind(null)); if(i>-1) return i; } return -1; }
  function idx(k){ return head.findIndex(function(h){return h.indexOf(k)===0}); }
  var iN=idx("name"),iP=idx("price"),iS=idx("size"),iC=idx("category"),iK=idx("in stock"),iF=idx("image file"),iL=idx("imagelink");
  products = rows.filter(function(r){return r[iN] && r[iN].trim()}).map(function(r,n){
    return { id:"p"+n+"_"+r[iN].trim().toLowerCase().replace(/\W+/g,"-"),
      name:r[iN].trim(), price:parseFloat(r[iP])||0, size:(r[iS]||"").trim(),
      cat:(r[iC]||"Other").trim()||"Other",
      stock:/^(y|yes|true|1)$/i.test((r[iK]||"").trim()),
      file:r[iF], link:r[iL] };
  });
  $("status").style.display="none";
  if(!products.length){ $("status").style.display="block"; $("status").textContent="No products yet."; }
  render();
}).catch(function(){
  $("status").className="msg err";
  $("status").textContent="Could not load products. Check your internet and refresh.";
});

function render(){
  var cats=["All"]; products.forEach(function(p){ if(cats.indexOf(p.cat)<0) cats.push(p.cat); });
  $("cats").innerHTML = cats.map(function(c){ return '<button class="'+(c===cat?"on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'; }).join("");
  $("list").innerHTML = products.filter(function(p){return cat==="All"||p.cat===cat}).map(function(p){
    var q=cart[p.id]?cart[p.id].q:0, u=imgUrl(p);
    var ctl = !p.stock ? '<button class="add" disabled>Out of stock</button>'
      : q ? '<div class="qty"><button data-m="'+p.id+'">−</button><b>'+q+'</b><button data-a="'+p.id+'">+</button></div>'
      : '<button class="add" data-a="'+p.id+'">Add to cart</button>';
    return '<div class="p">'+(u?'<img loading="lazy" src="'+u+'" alt="'+esc(p.name)+'">':'<img alt="">')+
      '<div class="b"><div class="n">'+esc(p.name)+'</div><div class="s">'+esc(p.size)+'</div><div class="pr">₹'+p.price+'</div>'+ctl+'</div></div>';
  }).join("");
  count();
}
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function find(id){ return products.filter(function(p){return p.id===id})[0]; }
function change(id,d){
  var p=find(id); if(!p) return;
  var q=(cart[id]?cart[id].q:0)+d;
  if(q<=0) delete cart[id]; else cart[id]={q:q};
  save(); render(); if($("panel").classList.contains("open")) drawCart();
}
function count(){ var n=0; for(var k in cart) if(find(k)) n+=cart[k].q; $("cnt").textContent=n; }
function drawCart(){
  var h="",t=0;
  Object.keys(cart).forEach(function(id){
    var p=find(id); if(!p) return;
    var q=cart[id].q; t+=p.price*q;
    h+='<div class="row"><div class="t">'+esc(p.name)+'<small>'+esc(p.size)+' · ₹'+p.price+' each</small></div>'+
       '<div class="qty"><button data-m="'+id+'">−</button><b>'+q+'</b><button data-a="'+id+'">+</button></div>'+
       '<b>₹'+(p.price*q)+'</b></div>';
  });
  $("items").innerHTML = h || '<div class="msg">Your cart is empty.</div>';
  $("tot").textContent="₹"+t;
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.a) change(b.dataset.a,1);
  else if(b.dataset.m) change(b.dataset.m,-1);
  else if(b.dataset.c){ cat=b.dataset.c; render(); }
});
$("open").onclick=function(){ drawCart(); $("panel").classList.add("open"); };
$("close").onclick=function(){ $("panel").classList.remove("open"); };
$("panel").onclick=function(e){ if(e.target===$("panel")) $("panel").classList.remove("open"); };

$("send").onclick=function(){
  var lines=[],t=0;
  Object.keys(cart).forEach(function(id){
    var p=find(id); if(!p) return;
    var q=cart[id].q; t+=p.price*q;
    lines.push("• "+p.name+(p.size?" ("+p.size+")":"")+" × "+q+" = ₹"+(p.price*q));
  });
  var n=$("cn").value.trim(), ph=$("cp").value.trim(), a=$("ca").value.trim();
  if(!lines.length){ $("hint").textContent="Add at least one product."; return; }
  if(!n||!ph||!a){ $("hint").textContent="Please enter name, phone and address."; return; }
  $("hint").textContent="";
  var msg="*New order – "+SHOP_NAME+"*\n\n"+lines.join("\n")+"\n\n*Total: ₹"+t+"*\n\nName: "+n+"\nPhone: "+ph+"\nAddress: "+a;
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");
};
</script>
</body>
</html>

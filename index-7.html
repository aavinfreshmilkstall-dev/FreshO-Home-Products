<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreshO Home Products</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14263d;--mute:#64748b;--line:#dde4ee;--blue:#1a56a8;--green:#1e8449;--red:#c0392b;--offer:#e67e22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2a;--card:#172538;--ink:#eaf0f8;--mute:#9db0c7;--line:#27384f;--blue:#6aa3ee;--green:#4cc47f;--red:#ff8a80;--offer:#f5a35c}}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:10px 14px 12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font-size:1.15rem;margin:0}
.cartbtn{border:0;background:#fff;color:#14263d;font-weight:700;padding:8px 13px;border-radius:8px;font-size:.92rem}
#q{width:100%;padding:11px 14px;border:0;border-radius:10px;font:inherit;background:#fff;color:#14263d}
main{padding:0 14px 100px;max-width:1000px;margin:0 auto}
/* banner */
#ban{position:relative;margin:12px 0 4px;border-radius:14px;overflow:hidden;display:none}
.slide{display:none;min-height:130px;padding:20px;color:#fff;background:linear-gradient(120deg,#1a56a8,#2e86de);background-size:cover;background-position:center;cursor:pointer;position:relative}
.slide.on{display:flex;flex-direction:column;justify-content:center}
.slide.img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.05))}
.slide>*{position:relative}
.slide b{font-size:1.3rem;line-height:1.2}
.slide span{margin-top:4px;font-size:.95rem}
.slide i{margin-top:10px;font-style:normal;font-weight:700;background:#fff;color:#14263d;padding:6px 12px;border-radius:20px;align-self:flex-start;font-size:.85rem}
.dots{position:absolute;bottom:8px;right:12px;display:flex;gap:5px}
.dots u{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.dots u.on{background:#fff}
/* chips */
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.cats button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:20px;font-size:.9rem}
.cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.p.hl{outline:3px solid var(--offer)}
.p img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.tag{position:absolute;top:8px;left:8px;background:var(--offer);color:#fff;font-weight:700;font-size:.78rem;padding:3px 8px;border-radius:6px}
.p .b{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.p .n{font-weight:600;font-size:.95rem}
.p .s{color:var(--mute);font-size:.85rem}
.p .pr{font-weight:700;margin-top:auto;font-size:1.05rem}
.p .pr s{color:var(--mute);font-weight:400;font-size:.85rem;margin-left:5px}
.p .pr em{font-style:normal;color:var(--offer)}
.add{border:0;background:var(--green);color:#fff;padding:10px;border-radius:8px;font-weight:600;margin-top:6px}
.add[disabled]{background:var(--line);color:var(--mute)}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.qty button{width:38px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:1.1rem}
.msg{padding:30px 0;color:var(--mute);text-align:center}
.msg.err{color:var(--red)}
/* bottom bar */
#bar{position:fixed;left:12px;right:12px;bottom:12px;max-width:600px;margin:0 auto;background:var(--green);color:#fff;border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:1rem;display:none;justify-content:space-between;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* cart sheet */
#panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
#panel.open{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:16px;max-width:600px;margin:0 auto}
.sheet h2{margin:0 0 10px;font-size:1.1rem;display:flex;justify-content:space-between}
.sheet h2 button{border:0;background:none;color:var(--ink);font-size:1.4rem}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;font-size:.92rem}
.row .t small{color:var(--mute);display:block}
.row .qty{margin:0;gap:8px}
.row .qty button{width:32px;height:32px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;padding:12px 0}
input.f,textarea{width:100%;padding:11px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.wa{width:100%;border:0;background:#1fa855;color:#fff;font-weight:700;font-size:1rem;padding:13px;border-radius:9px}
.hint{color:var(--red);font-size:.85rem;min-height:1.2em;margin:0 0 6px}
</style>
</head>
<body>

<header>
  <div class="top"><h1 id="shop"></h1><button class="cartbtn" id="open">Cart (<span id="cnt">0</span>)</button></div>
  <input id="q" type="search" placeholder="Search products…" autocomplete="off">
</header>

<main>
  <div id="ban"></div>
  <div class="cats" id="cats"></div>
  <div id="list" class="grid"></div>
  <div id="status" class="msg">Loading products…</div>
</main>

<button id="bar"><span id="barn"></span><span id="bart"></span></button>

<div id="panel">
  <div class="sheet">
    <h2>Your cart <button id="close" aria-label="Close">×</button></h2>
    <div id="items"></div>
    <div class="total"><span>Total</span><span id="tot">₹0</span></div>
    <input class="f" id="cn" placeholder="Your name" autocomplete="name">
    <input class="f" id="cp" placeholder="Phone number" inputmode="tel" autocomplete="tel">
    <textarea id="ca" rows="2" placeholder="Delivery address"></textarea>
    <p class="hint" id="hint"></p>
    <button class="wa" id="send">Order on WhatsApp</button>
  </div>
</div>

<script>
/* ===== EDIT ONLY THESE LINES ===== */
var SHOP_NAME   = "FreshO Home Products";
var WHATSAPP    = "91XXXXXXXXXX";   // country code + number, no + or spaces
var CSV_URL     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTTZAFsFciHj3ZiLtwSKTweWz9tgiqv4CFRAx46MOQxA9YWdHBn8X4Aj8fAiV1VN0GhCr-tte8yP0F/pub?gid=0&single=true&output=csv";
var BANNERS_CSV = "";               // paste the published CSV link of the Banners tab here
/* ================================= */

var $ = function(id){return document.getElementById(id)};
var products = [], banners = [], cart = {}, cat = "All", term = "", bi = 0, timer = null;
document.title = SHOP_NAME; $("shop").textContent = SHOP_NAME;

try { cart = JSON.parse(localStorage.getItem("cart") || "{}"); } catch(e){ cart = {}; }
function save(){ try { localStorage.setItem("cart", JSON.stringify(cart)); } catch(e){} }

function parseCSV(t){
  var rows=[],r=[],f="",q=false;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==","){ r.push(f); f=""; }
    else if(c=="\n"||c=="\r"){ if(c=="\r"&&t[i+1]=="\n")i++; r.push(f); f=""; rows.push(r); r=[]; }
    else f+=c;
  }
  if(f!==""||r.length){ r.push(f); rows.push(r); }
  return rows;
}
function heads(rows){ return rows.shift().map(function(h){return h.trim().toLowerCase()}); }
function ix(head,k){ return head.findIndex(function(h){return h.indexOf(k)===0}); }
function fileId(s){ var m=String(s||"").match(/[-\w]{25,}/); return m?m[0]:""; }
function lh(id,w){ return "https://lh3.googleusercontent.com/d/"+id+"=w"+w; }
function imgUrl(p){ var id=fileId(p.link)||fileId(p.file); return id?lh(id,600):""; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }

/* accepts 2026-10-15 or 15/10/2026 */
function pDate(s){
  s=String(s||"").trim(); if(!s) return null;
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  return null;
}
function today(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function eff(p){ // effective price
  if(p.offer>0 && p.offer<p.price){
    var till=pDate(p.till);
    if(!till || today()<=till) return p.offer;
  }
  return p.price;
}

/* load products */
fetch(CSV_URL).then(function(r){return r.text()}).then(function(t){
  var rows=parseCSV(t), h=heads(rows);
  var iN=ix(h,"name"),iP=ix(h,"price"),iS=ix(h,"size"),iC=ix(h,"category"),iK=ix(h,"in stock"),iF=ix(h,"image file"),iL=ix(h,"imagelink"),iO=ix(h,"offer price"),iT=ix(h,"offer till");
  products=rows.filter(function(r){return r[iN]&&r[iN].trim()}).map(function(r,n){
    return { id:"p"+n+"_"+r[iN].trim().toLowerCase().replace(/\W+/g,"-"),
      name:r[iN].trim(), price:parseFloat(r[iP])||0, size:(r[iS]||"").trim(),
      cat:(r[iC]||"Other").trim()||"Other",
      stock:/^(y|yes|true|1)$/i.test((r[iK]||"").trim()),
      file:r[iF], link:r[iL],
      offer:iO>-1?(parseFloat(r[iO])||0):0, till:iT>-1?r[iT]:"" };
  });
  $("status").style.display="none";
  if(!products.length){ $("status").style.display="block"; $("status").textContent="No products yet."; }
  render(); drawBar();
}).catch(function(){
  $("status").className="msg err";
  $("status").textContent="Could not load products. Check your internet and refresh.";
});

/* load banners (optional) */
if(BANNERS_CSV){
  fetch(BANNERS_CSV).then(function(r){return r.text()}).then(function(t){
    var rows=parseCSV(t), h=heads(rows);
    var iT=ix(h,"title"),iX=ix(h,"text"),iI=ix(h,"image"),iS=ix(h,"start"),iE=ix(h,"end"),iG=ix(h,"target"),iC=ix(h,"color");
    var td=today();
    banners=rows.filter(function(r){return r[iT]&&r[iT].trim()}).map(function(r){
      return {title:r[iT].trim(),text:iX>-1?(r[iX]||""):"",img:iI>-1?fileId(r[iI]):"",
        s:iS>-1?pDate(r[iS]):null,e:iE>-1?pDate(r[iE]):null,tg:iG>-1?(r[iG]||"").trim():"",color:iC>-1?(r[iC]||"").trim():""};
    }).filter(function(b){ return (!b.s||td>=b.s)&&(!b.e||td<=b.e); });
    drawBanners();
  }).catch(function(){});
}

function drawBanners(){
  var box=$("ban");
  if(!banners.length){ box.style.display="none"; return; }
  box.style.display="block";
  box.innerHTML=banners.map(function(b,i){
    var st=b.img?'background-image:url('+lh(b.img,900)+')':(/^#[0-9a-f]{3,8}$/i.test(b.color)?'background:'+b.color:'');
    return '<div class="slide'+(i===0?' on':'')+(b.img?' img':'')+'" data-i="'+i+'" style="'+st+'"><b>'+esc(b.title)+'</b>'+
      (b.text?'<span>'+esc(b.text)+'</span>':'')+(b.tg?'<i>Shop now</i>':'')+'</div>';
  }).join("")+(banners.length>1?'<div class="dots">'+banners.map(function(b,i){return '<u class="'+(i===0?'on':'')+'"></u>'}).join("")+'</div>':'');
  bi=0; clearInterval(timer);
  if(banners.length>1) timer=setInterval(function(){ show((bi+1)%banners.length); },4500);
}
function show(i){
  bi=i;
  var s=document.querySelectorAll(".slide"), d=document.querySelectorAll(".dots u");
  for(var k=0;k<s.length;k++){ s[k].classList.toggle("on",k===i); if(d[k]) d[k].classList.toggle("on",k===i); }
}
function goTarget(tg){
  if(!tg) return;
  var low=tg.toLowerCase();
  var cats=products.map(function(p){return p.cat});
  var c=cats.filter(function(x){return x.toLowerCase()===low})[0];
  if(c){ cat=c; term=""; $("q").value=""; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  var p=products.filter(function(x){return x.name.toLowerCase()===low})[0];
  if(p){ cat="All"; term=p.name.toLowerCase(); $("q").value=p.name; render(); var el=document.querySelector(".p"); if(el){ el.classList.add("hl"); el.scrollIntoView({behavior:"smooth",block:"center"}); } }
}

function render(){
  var cats=["All"]; products.forEach(function(p){ if(cats.indexOf(p.cat)<0) cats.push(p.cat); });
  $("cats").innerHTML=cats.map(function(c){ return '<button class="'+(c===cat?"on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'; }).join("");
  var list=products.filter(function(p){
    return (cat==="All"||p.cat===cat)&&(!term||(p.name+" "+p.cat+" "+p.size).toLowerCase().indexOf(term)>-1);
  });
  $("list").innerHTML=list.map(function(p){
    var q=cart[p.id]?cart[p.id].q:0, u=imgUrl(p), e=eff(p), off=e<p.price;
    var ctl=!p.stock?'<button class="add" disabled>Out of stock</button>'
      :q?'<div class="qty"><button data-m="'+p.id+'">−</button><b>'+q+'</b><button data-a="'+p.id+'">+</button></div>'
      :'<button class="add" data-a="'+p.id+'">Add to cart</button>';
    var fb=fileId(p.link||p.file);
    var im=u?'<img loading="lazy" src="'+u+'" alt="'+esc(p.name)+'" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=\'https://drive.google.com/thumbnail?id='+fb+'&sz=w600\'}">':'<img alt="">';
    return '<div class="p">'+(off?'<span class="tag">'+Math.round((1-e/p.price)*100)+'% OFF</span>':'')+im+
      '<div class="b"><div class="n">'+esc(p.name)+'</div><div class="s">'+esc(p.size)+'</div>'+
      '<div class="pr">'+(off?'<em>₹'+e+'</em><s>₹'+p.price+'</s>':'₹'+p.price)+'</div>'+ctl+'</div></div>';
  }).join("");
  if(products.length&&!list.length){ $("list").innerHTML='<div class="msg" style="grid-column:1/-1">No products found.</div>'; }
}
function find(id){ return products.filter(function(p){return p.id===id})[0]; }
function change(id,d){
  var p=find(id); if(!p) return;
  var q=(cart[id]?cart[id].q:0)+d;
  if(q<=0) delete cart[id]; else cart[id]={q:q};
  save(); render(); drawBar(); if($("panel").classList.contains("open")) drawCart();
}
function totals(){ var n=0,t=0; for(var k in cart){ var p=find(k); if(p){ n+=cart[k].q; t+=eff(p)*cart[k].q; } } return {n:n,t:t}; }
function drawBar(){
  var x=totals(); $("cnt").textContent=x.n;
  $("bar").style.display=x.n?"flex":"none";
  $("barn").textContent=x.n+(x.n===1?" item":" items");
  $("bart").textContent="View cart · ₹"+x.t;
}
function drawCart(){
  var h="";
  Object.keys(cart).forEach(function(id){
    var p=find(id); if(!p) return;
    var q=cart[id].q, e=eff(p);
    h+='<div class="row"><div class="t">'+esc(p.name)+'<small>'+esc(p.size)+' · ₹'+e+' each</small></div>'+
       '<div class="qty"><button data-m="'+id+'">−</button><b>'+q+'</b><button data-a="'+id+'">+</button></div><b>₹'+(e*q)+'</b></div>';
  });
  $("items").innerHTML=h||'<div class="msg">Your cart is empty.</div>';
  $("tot").textContent="₹"+totals().t;
}

document.addEventListener("click",function(e){
  var s=e.target.closest(".slide"); if(s){ goTarget(banners[+s.dataset.i].tg); return; }
  var b=e.target.closest("button"); if(!b) return;
  if(b.dataset.a) change(b.dataset.a,1);
  else if(b.dataset.m) change(b.dataset.m,-1);
  else if(b.dataset.c){ cat=b.dataset.c; render(); }
});
$("q").addEventListener("input",function(){ term=this.value.trim().toLowerCase(); render(); });
function openCart(){ drawCart(); $("panel").classList.add("open"); }
$("open").onclick=openCart; $("bar").onclick=openCart;
$("close").onclick=function(){ $("panel").classList.remove("open"); };
$("panel").onclick=function(e){ if(e.target===$("panel")) $("panel").classList.remove("open"); };

$("send").onclick=function(){
  var lines=[],t=0;
  Object.keys(cart).forEach(function(id){
    var p=find(id); if(!p) return;
    var q=cart[id].q, e=eff(p); t+=e*q;
    lines.push("• "+p.name+(p.size?" ("+p.size+")":"")+" × "+q+" = ₹"+(e*q));
  });
  var n=$("cn").value.trim(), ph=$("cp").value.trim(), a=$("ca").value.trim();
  if(!lines.length){ $("hint").textContent="Add at least one product."; return; }
  if(!n||!ph||!a){ $("hint").textContent="Please enter name, phone and address."; return; }
  $("hint").textContent="";
  var msg="*New order – "+SHOP_NAME+"*\n\n"+lines.join("\n")+"\n\n*Total: ₹"+t+"*\n\nName: "+n+"\nPhone: "+ph+"\nAddress: "+a;
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");
};
</script>
</body>
</html>

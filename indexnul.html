<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FreshO Home Products</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
margin:0;
}

header{

padding:30px;
text-align:center;
}

.container{

}

.product{
background:white;

}

.price{
font-size:28px;
font-weight:bold;
color:green;
margin:10px 0;
}

.btn{
background:#008000;
color:white;
border:none;
padding:12px 20px;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.cart{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.15);
margin-top:20px;
}

.whatsapp{
background:#25D366;
color:white;
padding:15px 25px;
border-radius:8px;
text-decoration:none;
display:inline-block;
font-weight:bold;
margin-top:15px;
}

</style>
</head>

<body>

<header>
<h1>FreshO Home Products</h1>
<p>Fresh Milk & Home Products Delivered To Your Doorstep</p>
</header>

<div class="container">

<div class="product">
<h2>🥛 Fresh Cow Milk</h2>
<p>1 Litre Pack</p>
<div class="price">₹60</div>
<button class="btn" onclick="addToCart('Fresh Cow Milk',60)">
Add to Cart
</button>
</div>

<div class="product">
<h2>🍶 Curd</h2>
<p>500 gm Pack</p>
<div class="price">₹40</div>
<button class="btn" onclick="addToCart('Curd',40)">
Add to Cart
</button>
</div>

<div class="product">
<h2>🧈 Ghee</h2>
<p>500 ml Pack</p>
<div class="price">₹350</div>
<button class="btn" onclick="addToCart('Ghee',350)">
Add to Cart
</button>
</div>

<div class="cart">

<h2>🛒 Cart</h2>

<ul id="cartItems"></ul>

<h3 id="total">Total: ₹0</h3>

Checkout via WhatsApp
</a>

</div>

</div>

<script>

let cart=[];
let total=0;

function addToCart(product,price){

cart.push({product,price});

total += price;

updateCart();

}

function updateCart(){

let list=document.getElementById("cartItems");

list.innerHTML="";

cart.forEach(item=>{

let li=document.createElement("li");

li.textContent=item.product+" - ₹"+item.price;

list.appendChild(li);

});

document.getElementById("total").innerHTML=
"Total: ₹"+total;

}

function sendWhatsApp(){

if(cart.length===0){

alert("Cart is empty");

return false;

}

let message="FreshO Home Products Order%0A%0A";

cart.forEach((item,index)=>{

message += (index+1)+". "+item.product+
" - ₹"+item.price+"%0A";

});

message += "%0ATotal = ₹"+total;

window.open(
"https://wa.me/919894043765?text="+message,
"_blank"
);

return false;

}

</script>

</body>
</html>
